# =============================================================================
# Build the Android APK for 阿圆短剧.
# =============================================================================
name: 阿圆短剧 · Build Android APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "目标 ABI；all 会生成所有支持架构的 APK"
        required: true
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - all
        default: arm64-v8a
      build_mode:
        description: "构建类型"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: ayuan-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 构建阿圆短剧 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/bridge/go.mod
          cache: true
          cache-dependency-path: native/bridge/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Verify build tools
        run: |
          set -euo pipefail
          java -version
          go version
          flutter --version
          python --version
          test -x "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build APK
        env:
          ABI: ${{ inputs.abi }}
          BUILD_MODE: ${{ inputs.build_mode }}
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          mkdir -p dist/android
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          python scripts/build_android.py \
            --ndk "$ANDROID_NDK_HOME" \
            --abi "$ABI" \
            --mode "$BUILD_MODE" \
            --output-dir dist/android 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "===== 关键错误行 ====="
            grep -nEi "FAILURE:|Execution failed|What went wrong|error:|Error:|^e: |ndk|cmake|go build|cgo|Could not|Gradle" build.log | tail -n 80 || true
            echo "===== build.log 末尾 200 行 ====="
            tail -n 200 build.log
          else
            echo "build.log 不存在；失败发生在构建命令启动之前。"
          fi

      - name: Write failure summary
        if: failure()
        env:
          ABI: ${{ inputs.abi }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          {
            echo "## Android 构建失败"
            echo "- ABI: ${ABI}"
            echo "- Mode: ${BUILD_MODE}"
            echo "- Go: $(go version 2>&1 || true)"
            echo "- Flutter: $(flutter --version 2>&1 | head -n 1 || true)"
            echo
            echo "### build.log（末尾 200 行）"
            echo '```text'
            if [ -f build.log ]; then tail -n 200 build.log; else echo "build.log 不存在"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK outputs
        run: |
          set -euo pipefail
          mapfile -t apks < <(find dist/android -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "未找到 APK 产物"
            exit 1
          fi
          ls -lh "${apks[@]}"

      - name: Upload 阿圆短剧 APK
        uses: actions/upload-artifact@v4
        with:
          name: ayuan-apk-${{ inputs.abi }}-${{ inputs.build_mode }}
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 14
