# =============================================================================
# 仓库路径: .github/workflows/build-android-ayuan.yml
# 变更类型: 【新增】或替换原 test 工作流
# 说明:     构建「阿圆短剧」Android 手机 APK（arm64-v8a）
# =============================================================================
name: 阿圆短剧 · Build Android APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "目标 ABI（手机推荐 arm64-v8a）"
        required: true
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - all
        default: arm64-v8a
      build_mode:
        description: "构建类型"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: ayuan-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 构建阿圆短剧 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          cache: true
          cache-dependency-path: native/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与项目锁定版本一致时可再改
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          # 手机安装包常用 API
          sdkmanager "platforms;android-34" || true

      - name: Verify build tools
        run: |
          set -euo pipefail
          java -version
          go version
          flutter --version
          python --version
          sdkmanager --list_installed | head -n 40

      - name: Flutter pub get
        run: |
          set -euo pipefail
          flutter pub get

      - name: Build APK（阿圆短剧）
        env:
          ABI: ${{ inputs.abi }}
          BUILD_MODE: ${{ inputs.build_mode }}
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          # 应用显示名（若脚本/Gradle 读取该变量可覆盖 label）
          APP_DISPLAY_NAME: 阿圆短剧
        run: |
          set -euo pipefail

          # 优先走仓库统一脚本；不存在则回退 flutter build apk
          if [ -f scripts/build_android.py ]; then
            ARGS=(--abi "$ABI")
            # 全 ABI
            if [ "$ABI" = "all" ]; then
              ARGS=(--abi arm64-v8a)
              # 若脚本支持多 ABI，可改为不传或 --all-abi
            fi
            if [ "$BUILD_MODE" = "debug" ]; then
              ARGS+=(--debug)
            fi
            python scripts/build_android.py "${ARGS[@]}"
          else
            echo "scripts/build_android.py 不存在，使用 flutter build apk"
            case "$ABI" in
              arm64-v8a)
                TARGET_PLATFORM="android-arm64"
                ;;
              armeabi-v7a)
                TARGET_PLATFORM="android-arm"
                ;;
              all)
                TARGET_PLATFORM=""
                ;;
              *)
                TARGET_PLATFORM="android-arm64"
                ;;
            esac
            if [ "$BUILD_MODE" = "debug" ]; then
              if [ -n "$TARGET_PLATFORM" ]; then
                flutter build apk --debug --target-platform="$TARGET_PLATFORM"
              else
                flutter build apk --debug
              fi
            else
              if [ -n "$TARGET_PLATFORM" ]; then
                flutter build apk --release --target-platform="$TARGET_PLATFORM"
              else
                flutter build apk --release
              fi
            fi
            mkdir -p dist/android
            # 拷贝并统一命名为阿圆短剧
            if [ "$BUILD_MODE" = "debug" ]; then
              SRC=$(find build/app/outputs/flutter-apk -name "app-*-debug.apk" | head -n1 || true)
              [ -n "${SRC:-}" ] || SRC=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n1)
              cp -f "$SRC" "dist/android/阿圆短剧-debug-${ABI}.apk"
            else
              SRC=$(find build/app/outputs/flutter-apk -name "app-*-release.apk" | head -n1 || true)
              [ -n "${SRC:-}" ] || SRC=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n1)
              cp -f "$SRC" "dist/android/阿圆短剧-${ABI}.apk"
            fi
          fi

      - name: Rename APK to 阿圆短剧
        run: |
          set -euo pipefail
          mkdir -p dist/android
          # 脚本产物若在 dist/android，统一改成带中文名的文件
          shopt -s nullglob
          for f in dist/android/*.apk build/app/outputs/flutter-apk/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              阿圆短剧*) continue ;;
            esac
            out="dist/android/阿圆短剧-${{ inputs.build_mode }}-${{ inputs.abi }}.apk"
            cp -f "$f" "$out"
            echo "renamed: $f -> $out"
          done
          ls -lah dist/android/ || true

      - name: Verify APK exists
        run: |
          set -euo pipefail
          echo "APK list:"
          find dist/android -maxdepth 1 -type f -name "*.apk" -print
          test "$(find dist/android -maxdepth 1 -type f -name "*.apk" | wc -l)" -ge 1

      - name: Upload 阿圆短剧 APK
        uses: actions/upload-artifact@v4
        with:
          name: 阿圆短剧-android-${{ inputs.build_mode }}-${{ inputs.abi }}
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 14
