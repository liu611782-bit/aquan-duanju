# =============================================================================
# 仓库路径: .github/workflows/build-android-ayuan.yml
# 变更类型: 替换
# 说明:     构建「阿圆短剧」Android 手机 APK（arm64-v8a）
# =============================================================================
name: 阿圆短剧 · Build Android APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "目标 ABI（手机推荐 arm64-v8a）"
        required: true
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - all
        default: arm64-v8a
      build_mode:
        description: "构建类型"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: ayuan-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 构建阿圆短剧 APK
    # 固定到 24.04，避免 ubuntu-latest 迁移到 Ubuntu 26 后环境变化
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          cache: true
          cache-dependency-path: native/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 不固定版本，安装最新 stable，以满足 pubspec.yaml 中 SDK ^3.13.7 的要求。
          # 若想固定，请改成本地 `flutter --version` 显示的版本号（Dart 需 >= 3.13.7）。
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          # 手机安装包常用 API
          sdkmanager "platforms;android-34" || true

      - name: Verify build tools
        run: |
          set -euo pipefail
          java -version
          go version
          flutter --version
          python --version
          sdkmanager --list_installed || true

      - name: Flutter pub get
        run: |
          set -euo pipefail
          flutter pub get

      - name: Build APK（阿圆短剧）
        env:
          ABI: ${{ inputs.abi }}
          BUILD_MODE: ${{ inputs.build_mode }}
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          APP_DISPLAY_NAME: 阿圆短剧
        run: |
          set -euo pipefail

          # 定位 NDK（由 setup-android 设置 ANDROID_HOME，上一步安装的 NDK 版本固定为 28.2.13676358）
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          NDK_HOME="${SDK_ROOT}/ndk/28.2.13676358"
          if [ ! -d "$NDK_HOME" ]; then
            echo "未找到 NDK: $NDK_HOME"
            exit 1
          fi
          echo "NDK_HOME=$NDK_HOME"

          # 优先走仓库统一脚本；不存在则回退 flutter build apk
          if [ -f scripts/build_android.py ]; then
            ARGS=(--abi "$ABI" --ndk "$NDK_HOME")
            if [ "$ABI" = "all" ]; then
              ARGS=(--abi arm64-v8a --ndk "$NDK_HOME")
            fi
            if [ "$BUILD_MODE" = "debug" ]; then
              ARGS+=(--debug)
            fi
            python scripts/build_android.py "${ARGS[@]}"
          else
            echo "scripts/build_android.py 不存在，使用 flutter build apk"
            case "$ABI" in
              arm64-v8a)   TARGET_PLATFORM="android-arm64" ;;
              armeabi-v7a) TARGET_PLATFORM="android-arm" ;;
              all)         TARGET_PLATFORM="" ;;
              *)           TARGET_PLATFORM="android-arm64" ;;
            esac

            if [ "$BUILD_MODE" = "debug" ]; then
              if [ -n "$TARGET_PLATFORM" ]; then
                flutter build apk --debug --target-platform="$TARGET_PLATFORM"
              else
                flutter build apk --debug
              fi
            else
              if [ -n "$TARGET_PLATFORM" ]; then
                flutter build apk --release --target-platform="$TARGET_PLATFORM"
              else
                flutter build apk --release
              fi
            fi

            mkdir -p dist/android
            if [ "$BUILD_MODE" = "debug" ]; then
              SRC=$(find build/app/outputs/flutter-apk -name "app-*-debug.apk" | head -n1 || true)
              [ -n "${SRC:-}" ] || SRC=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n1)
              cp -f "$SRC" "dist/android/阿圆短剧-debug-${ABI}.apk"
            else
              SRC=$(find build/app/outputs/flutter-apk -name "app-*-release.apk" | head -n1 || true)
              [ -n "${SRC:-}" ] || SRC=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n1)
              cp -f "$SRC" "dist/android/阿圆短剧-${ABI}.apk"
            fi
          fi

    
