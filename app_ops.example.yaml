# 运维急停（可选文件，复制为 app_ops.yaml 放在 exe 同级目录或应用数据目录生效）
#
# 约定：功能开关一律在应用内「我的 → 设置」里；本文件只放「出了事要立刻停掉」
# 的开关。任何语法错误都按「全部关闭」处理，不会影响应用启动。

# 停止自动找源：同时拒绝「立即找源」按钮，避免后台被反复触发。
disable_auto_source: false

# 停止启动后的静默检查更新（用户手动点「检查更新」仍然可用，便于自救）。
disable_auto_update: false

# 冻结合并源：保留现有 merged_sources.json，不再自动覆盖（手动重建仍可用）。
disable_auto_merge: false
